<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d17">
<title>BM Hub — پنل کلیدها</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%233fa9ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='800' font-size='26' text-anchor='middle' fill='white'%3EBM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
	--bg: #0b0d17; --bg2: #10131f; --card: #151927; --card2: #1b2032; --line: #262c43; --line2: #323a57;
	--text: #e9ecf8; --dim: #98a0bf; --dim2: #6d7596;
	--accent: #7c5cff; --accent2: #3fa9ff; --grad: linear-gradient(135deg, #7c5cff, #3fa9ff);
	--ok: #33c983; --okbg: rgba(51,201,131,.12); --bad: #ff5c6c; --badbg: rgba(255,92,108,.12);
	--warn: #ffb547; --warnbg: rgba(255,181,71,.12); --info: #3fa9ff; --infobg: rgba(63,169,255,.12);
	--radius: 14px; --shadow: 0 10px 30px rgba(0,0,0,.35);
	--font: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14.5px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: -20% -10% auto auto; width: 60vw; height: 60vw; background: radial-gradient(closest-side, rgba(124,92,255,.16), transparent); pointer-events: none; z-index: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; flex: none; }
.card h3 svg { color: #a99bff; }
a { color: var(--accent2); text-decoration: none; }
.mono { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; letter-spacing: .3px; }
.hidden { display: none !important; }
.dim { color: var(--dim); } .dim2 { color: var(--dim2); } .small { font-size: 12.5px; }

/* دکمه‌ها و فرم */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 10px; padding: 9px 15px; cursor: pointer; background: var(--card2); border-color: var(--line2); transition: .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--grad); border: 0; color: #fff; font-weight: 700; box-shadow: 0 6px 18px rgba(124,92,255,.35); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--badbg); color: var(--bad); border-color: rgba(255,92,108,.35); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.input, select.input, textarea.input { width: 100%; background: var(--bg2); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; outline: none; transition: .15s; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.18); }
textarea.input { resize: vertical; min-height: 70px; }
label.f { display: block; margin-bottom: 14px; }
label.f > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 200px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg2); cursor: pointer; font-size: 13px; transition: .15s; }
.chip.on { background: var(--grad); border-color: transparent; color: #fff; font-weight: 700; }
.chip .n { opacity: .75; margin-inline-start: 4px; }

/* چیدمان */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: rgba(16,19,31,.85); backdrop-filter: blur(10px); border-inline-end: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; font-weight: 800; color: #fff; box-shadow: 0 6px 18px rgba(124,92,255,.4); }
.brand b { display: block; font-size: 16px; } .brand small { color: var(--dim); }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; color: var(--dim); cursor: pointer; transition: .15s; border: 1px solid transparent; }
.nav:hover { color: var(--text); background: var(--card); }
.nav.on { color: #fff; background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(63,169,255,.12)); border-color: rgba(124,92,255,.35); }
.nav svg { width: 19px; height: 19px; flex: none; }
.side .foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); }
.me { display: flex; align-items: center; gap: 9px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line2); display: grid; place-items: center; font-weight: 700; }
.main { padding: 26px 30px 90px; max-width: 1180px; width: 100%; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.head h1 { font-size: 22px; margin: 0; font-weight: 800; }
.head p { margin: 2px 0 0; color: var(--dim); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 14px; }
.stats { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.two { grid-template-columns: 1fr 1fr; }
.stat { position: relative; overflow: hidden; }
.stat .v { font-size: 28px; font-weight: 800; line-height: 1.2; }
.stat .l { color: var(--dim); font-size: 13px; }
.stat .ic { position: absolute; inset-inline-end: 14px; top: 14px; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.stat .ic svg { width: 19px; height: 19px; }
.c-ok { color: var(--ok); background: var(--okbg); } .c-bad { color: var(--bad); background: var(--badbg); }
.c-warn { color: var(--warn); background: var(--warnbg); } .c-info { color: var(--info); background: var(--infobg); }
.c-acc { color: #b6a6ff; background: rgba(124,92,255,.14); }
.mini { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.mini:last-child { border-bottom: 0; }
.empty { color: var(--dim2); text-align: center; padding: 26px 10px; }

/* لیست کلیدها */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 260px; }
.search svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--dim2); }
.search .input { padding-inline-start: 36px; }
.bulk { position: sticky; top: 10px; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: rgba(27,32,50,.95); backdrop-filter: blur(8px); border: 1px solid rgba(124,92,255,.45); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
.list { display: grid; gap: 9px; }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; cursor: pointer; transition: .15s; }
.item:hover { border-color: var(--line2); background: var(--card2); }
.item.sel { border-color: var(--accent); }
.item .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .t b { font-size: 15px; }
.item .m { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12.5px; margin-top: 3px; }
.item .m span { display: inline-flex; align-items: center; gap: 5px; }
.item .m svg { width: 13px; height: 13px; }
.cb { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-active { color: var(--ok); background: var(--okbg); } .b-unused { color: var(--info); background: var(--infobg); }
.b-expired { color: var(--warn); background: var(--warnbg); } .b-revoked { color: var(--bad); background: var(--badbg); }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--line2); color: var(--dim); }

/* مودال، توست */
.overlay { position: fixed; inset: 0; background: rgba(5,6,12,.65); backdrop-filter: blur(4px); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; animation: pop .18s; }
.modal h2 { margin: 0 0 14px; font-size: 18px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; margin-top: 18px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 10px 0 4px; font-size: 13.5px; }
.kv > div:nth-child(odd) { color: var(--dim); }
.keybox { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg2); border: 1px dashed var(--line2); border-radius: 11px; padding: 10px 12px; margin-bottom: 10px; }
.keybox .mono { font-size: 15px; }
pre.code { background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; padding: 12px; overflow: auto; font: 12.5px/1.6 var(--mono); direction: ltr; text-align: left; margin: 0; white-space: pre-wrap; word-break: break-all; }
.toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; display: grid; gap: 8px; z-index: 80; }
.toast { background: var(--card2); border: 1px solid var(--line2); border-inline-start: 4px solid var(--ok); border-radius: 11px; padding: 10px 14px; box-shadow: var(--shadow); min-width: 220px; max-width: 360px; animation: pop .2s; }
.toast.err { border-inline-start-color: var(--bad); }
.uid { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: var(--bg2); border-radius: 9px; margin-bottom: 6px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.step button { width: 36px; height: 38px; background: var(--card2); border: 0; cursor: pointer; font-size: 18px; }
.step input { width: 56px; text-align: center; border: 0; background: var(--bg2); height: 38px; outline: none; }
.audit { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.audit:last-child { border-bottom: 0; }
.aic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.aic svg { width: 17px; height: 17px; }
.spin { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: translateY(6px) scale(.98); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ورود */
.login { min-height: 100vh; display: grid; place-items: center; padding: 18px; position: relative; z-index: 1; }
.login .card { width: min(400px, 100%); padding: 28px; box-shadow: var(--shadow); }
.login .logo { width: 52px; height: 52px; font-size: 20px; margin: 0 auto 12px; }
.login h1 { text-align: center; margin: 0 0 4px; font-size: 21px; }
.login p { text-align: center; color: var(--dim); margin: 0 0 20px; }

.mnav { display: none; }
@media (max-width: 860px) {
	.app { grid-template-columns: 1fr; }
	.side { display: none; }
	.main { padding: 18px 14px 96px; }
	.two { grid-template-columns: 1fr; }
	.mnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: rgba(16,19,31,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
	.mnav .nav { flex-direction: column; gap: 2px; padding: 6px 8px; font-size: 11px; }
	.item { grid-template-columns: 24px 1fr; }
	.item .r { grid-column: 2; }
	.kv { grid-template-columns: 110px 1fr; }
	.stat .v { font-size: 24px; }
}
</style>
</head>
<body>

<div id="login" class="login hidden">
	<div class="card">
		<div class="logo">BM</div>
		<h1>پنل کلیدهای BM Hub</h1>
		<p>برای ادامه وارد شو</p>
		<form id="loginForm">
			<label class="f"><span>نام کاربری</span><input class="input mono" id="lUser" autocomplete="username" placeholder="owner" autocapitalize="off" spellcheck="false"></label>
			<label class="f"><span>رمز</span><input class="input" id="lPass" type="password" autocomplete="current-password"></label>
			<button class="btn primary" style="width:100%" id="lBtn">ورود</button>
			<div class="small dim2" style="margin-top:12px;text-align:center">صاحب هاب: نام کاربری <span class="mono">owner</span> یا خالی</div>
		</form>
	</div>
</div>

<div id="app" class="app hidden">
	<aside class="side">
		<div class="brand"><div class="logo">BM</div><div><b>BM Hub</b><small>مدیریت کلیدها</small></div></div>
		<div id="nav"></div>
		<div class="foot">
			<div class="me"><div class="avatar" id="meAv">?</div><div class="grow"><div id="meName" style="font-weight:700">—</div><div class="small dim" id="meRole">—</div></div>
			<button class="btn ghost sm" data-act="logout" title="خروج">خروج</button></div>
		</div>
	</aside>
	<main class="main" id="main"></main>
	<nav class="mnav" id="mnav"></nav>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
var ICONS = {
	dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
	key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/></svg>',
	plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
	log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
	team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>',
	gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
	check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
	off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/></svg>',
	clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
	play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>',
	user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
	globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
	shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>',
	search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
	copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
	trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
	refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
	down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M4 20h16"/></svg>'
};

var S = { session: null, user: null, role: null, page: "dash", keys: [], stats: null, script: null, skew: 0, audit: null, admins: null,
	q: "", filter: "all", sort: "new", sel: {}, created: null, loading: false };
try { S.session = sessionStorage.getItem("bm_s"); S.page = sessionStorage.getItem("bm_p") || "dash"; } catch (e) {}

// ---------------------------------------------------------------- کمکی‌ها
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fa(n) { return Number(n || 0).toLocaleString("fa-IR"); }
function now() { return Date.now() + S.skew; }
function ago(t) {
	if (!t) return "هرگز";
	var s = Math.max(0, (now() - t) / 1000);
	if (s < 60) return "همین الان";
	if (s < 3600) return fa(Math.floor(s / 60)) + " دقیقه پیش";
	if (s < 86400) return fa(Math.floor(s / 3600)) + " ساعت پیش";
	if (s < 86400 * 30) return fa(Math.floor(s / 86400)) + " روز پیش";
	return new Date(t).toLocaleDateString("fa-IR");
}
function left(t) {
	if (!t) return "دائمی";
	var s = (t - now()) / 1000;
	if (s <= 0) return "تموم شده";
	if (s < 3600) return fa(Math.ceil(s / 60)) + " دقیقه مونده";
	if (s < 86400) return fa(Math.ceil(s / 3600)) + " ساعت مونده";
	return fa(Math.ceil(s / 86400)) + " روز مونده";
}
function dateFa(t) { return t ? new Date(t).toLocaleString("fa-IR", { dateStyle: "medium", timeStyle: "short" }) : "—"; }
function status(k) {
	if (k.revoked) return "revoked";
	if (k.expires && now() > k.expires) return "expired";

function modal(html, onMount) {
	var o = document.createElement("div");
	o.className = "overlay";
	o.innerHTML = '<div class="modal">' + html + "</div>";
	o.addEventListener("mousedown", function (e) { if (e.target === o) close(); });
	function close() { o.remove(); document.removeEventListener("keydown", onKey); }
	function onKey(e) { if (e.key === "Escape") close(); }
	document.addEventListener("keydown", onKey);
	$("modalRoot").appendChild(o);
	if (onMount) onMount(o.firstChild, close);
	var f = o.querySelector("[autofocus]"); if (f) f.focus();
	return close;
}

function bulk(a) {

	var texts = {

		"delete": ["حذف همیشگی " + n + " کلید", "برنمی‌گردن. ادمین‌ها فقط کلیدهای خودشون رو می‌تونن پاک کنن.", "حذف کن", true]
	}[a];
	confirmBox(texts[0], texts[1], texts[2], texts[3]).then(function (ok) {

document.addEventListener("click", function (e) {
	var t = e.target.closest("[data-page],[data-act],[data-copy],[data-sel],[data-selall],[data-open],[data-filter],[data-bulk],[data-st],[data-d],[data-admin]");
	if (!t || t.closest(".overlay")) return;
	if (t.matches("[data-sel]")) { e.stopPropagation(); if (t.checked) S.sel[t.dataset.sel] = 1; else delete S.sel[t.dataset.sel]; render(); return; }
	if (t.matches("[data-selall]")) { var on = t.checked; filtered().forEach(function (k) { if (on) S.sel[k.key] = 1; else delete S.sel[k.key]; }); render(); return; }
	if (t.matches("[data-copy]")) { e.stopPropagation(); copy(loaderFor(t.dataset.copy), "لودر کپی شد، برای همون نفر بفرست"); return; }
	if (t.matches("[data-page]")) { e.preventDefault(); go(t.dataset.page); return; }
	if (t.matches("[data-filter]")) { S.filter = t.dataset.filter; render(); return; }
	if (t.matches("[data-bulk]")) { bulk(t.dataset.bulk); return; }
	if (t.matches("[data-st]")) {
		var p = t.dataset.st.split(":"), inp = $(p[0]);
		inp.value = Math.min(Number(inp.max), Math.max(1, (Number(inp.value) || 1) + Number(p[1]))); return;
	}
	if (t.matches("[data-d]")) {
		document.querySelectorAll("#nDays .chip").forEach(function (c) { c.classList.toggle("on", c === t); });
		$("nCustom").classList.toggle("hidden", t.dataset.d !== "c"); if (t.dataset.d === "c") $("nCustom").focus(); return;
	}
	if (t.matches("[data-admin]")) {
		var u = t.dataset.admin;
		if (t.dataset.rm) {
			confirmBox("حذف ادمین", "«" + esc(u) + "» دیگه نمی‌تونه وارد بشه. کلیدهایی که ساخته سر جاشون می‌مونن.", "حذف کن", true).then(function (ok) {
				if (ok) api("setAdmin", { user: u, remove: true }).then(function () { toast("حذف شد"); S.admins = null; S.audit = null; loadAdmins(); }).catch(function (er) { toast(er.message, true); });
			});
		} else api("setAdmin", { user: u, disabled: t.dataset.dis === "1" }).then(function () { toast("انجام شد"); S.admins = null; S.audit = null; loadAdmins(); }).catch(function (er) { toast(er.message, true); });
		return;
	}
	if (t.matches("[data-open]")) { openKey(t.dataset.open); return; }
	var a = t.dataset.act;
	if (a === "logout") logout();
	else if (a === "reload") load().then(function () { toast("به‌روز شد"); });
	else if (a === "reloadAudit") { S.audit = null; render(); loadAudit(); }
	else if (a === "testGithub") {
		var box = $("ghResult"); box.innerHTML = '<div class="dim small">در حال آزمایش…</div>';
		api("testGithub").then(function (d) {
			var why = "";
			if (!d.ok) {
				var e = String(d.error || "");
				if (!d.hasToken) why = "GITHUB_TOKEN توی تنظیمات Worker نیست.";
				else if (e.indexOf("401") >= 0) why = "توکن گیت‌هاب اشتباهه یا باطل شده (مثلاً بعد از Regenerate). توکن جدید رو توی GITHUB_TOKEN بذار.";
				else if (e.indexOf("403") >= 0) why = "توکن اجازه‌ی خوندن نداره: Contents باید Read-only باشه و مخزن bm-hub انتخاب شده باشه.";
				else if (e.indexOf("404") >= 0) why = "فایل یا مخزن پیدا نشد: REPO / FILE / BRANCH رو چک کن، یا توکن به این مخزن دسترسی نداره.";
				else why = e || "خطای ناشناخته";
			}
			box.innerHTML = d.ok
				? '<div class="badge b-active">وصله</div> <span class="small">نسخه‌ی <b class="mono">' + esc(d.version) + "</b> از " + esc(d.repo) + "</span>"
				: '<div class="badge b-revoked">' + esc(d.error || "خطا") + '</div><div class="small" style="margin-top:6px">' + esc(why) + "</div>";
			S.script = { version: d.version, ok: d.ok, error: d.error };
		}).catch(function (er) { box.innerHTML = ""; toast(er.message, true); });
	}
	else if (a === "refresh") api("refresh").then(function () { toast("از این به بعد آخرین نسخه داده میشه"); S.audit = null; }).catch(function (er) { toast(er.message, true); });
	else if (a === "export") api("export").then(function (d) {
		var blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
		var link = document.createElement("a"); link.href = URL.createObjectURL(blob);
		link.download = "bmhub-keys-" + new Date().toISOString().slice(0, 10) + ".json"; link.click();
		setTimeout(function () { URL.revokeObjectURL(link.href); }, 2000); toast("پشتیبان دانلود شد");
	}).catch(function (er) { toast(er.message, true); });
	else if (a === "genPass") {
		var ch = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789", b = new Uint8Array(14), s = "";
		crypto.getRandomValues(b); for (var i = 0; i < b.length; i++) s += ch[b[i] % ch.length];
		$("aPass").value = s; copy(s, "رمز تصادفی ساخته و کپی شد");
	}
	else if (a === "copyAllNew" && S.created) copy(S.created.map(function (k) { return "-- " + k.name + "\n" + loaderFor(k.key); }).join("\n\n"), "همه‌ی لودرها کپی شد");
});

function showApp() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); }

function doLogin() {

function logout(expired) {
	if (S.session && !expired) api("logout").catch(function () {});

	try { sessionStorage.removeItem("bm_s"); } catch (e) {}

	showLogin();
}
try { $("lUser").value = localStorage.getItem("bm_u") || ""; } catch (e) {}
if (S.session) {
	api("me").then(function (d) { S.user = d.user; S.role = d.role; showApp(); render(); load(); }).catch(function () { showLogin(); });
} else showLogin();
// تازه کردن خودکار؛ وقتی داری چیزی تایپ می‌کنی یا صفحه‌ی ساخت/ادمین بازه نه (فرم پاک میشه)
setInterval(function () {
	var ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
	if (S.session && !document.hidden && !typing && !document.querySelector(".overlay") && S.page !== "new" && S.page !== "team") load(true);
}, 60000);
</script>
